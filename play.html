<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딴짓 | 주식회사 라릭</title>
<meta name="description" content="일하다 말고 만든 것들 — 중력 우편함, 감정 정원, 글자낙하, 하늘창, 소리그림, Letter Rain. 전부 만지면 반응합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF1ED;
  --ink:#0E1211;
  --text:#0F1412;
  --soft:#6A736D;
  --line:rgba(15,20,18,.14);
  --accent:#0F6B4F;
  --sans:"IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  --pad:clamp(1.25rem,5vw,5rem);
  --maxw:80rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#EFF1ED; --text:#0F1412; --soft:#6A736D; }
}
:root[data-theme="dark"]{ --bg:#EFF1ED; --text:#0F1412; --soft:#6A736D; }

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-weight:300;
  font-size:clamp(.9375rem,.9rem + .2vw,1.0625rem);
  line-height:1.7; letter-spacing:-.012em; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--accent); color:#fff; }
a{ color:inherit; }
a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }
.wrap{ max-width:var(--maxw); margin:0 auto; padding-left:var(--pad); padding-right:var(--pad); position:relative; z-index:1; }

/* ---- logo: 16선 로제트 (명함 확정안) ---- */
.rosette{
  --rs:20px; --u:calc(var(--rs) / 19.6);
  position:relative; display:inline-block; flex:0 0 auto;
  width:var(--rs); height:var(--rs); color:inherit;
}
.rosette .rot{ position:absolute; inset:0; }
.rosette i{
  position:absolute; left:50%; bottom:50%;
  width:max(1px, calc(var(--u) * .6));
  height:calc(var(--u) * var(--len,6.5));
  margin-left:calc(max(1px, calc(var(--u) * .6)) / -2);
  background:currentColor; border-radius:99px;
  transform-origin:50% 100%;
  transform:rotate(var(--a,0deg)) translateY(calc(var(--u) * -3));
}
.rosette i:nth-child(odd){ --len:6.5; }
.rosette i:nth-child(even){ --len:4; }
.rosette i:nth-child(1){ --a:0deg }    .rosette i:nth-child(2){ --a:22.5deg }
.rosette i:nth-child(3){ --a:45deg }   .rosette i:nth-child(4){ --a:67.5deg }
.rosette i:nth-child(5){ --a:90deg }   .rosette i:nth-child(6){ --a:112.5deg }
.rosette i:nth-child(7){ --a:135deg }  .rosette i:nth-child(8){ --a:157.5deg }
.rosette i:nth-child(9){ --a:180deg }  .rosette i:nth-child(10){ --a:202.5deg }
.rosette i:nth-child(11){ --a:225deg } .rosette i:nth-child(12){ --a:247.5deg }
.rosette i:nth-child(13){ --a:270deg } .rosette i:nth-child(14){ --a:292.5deg }
.rosette i:nth-child(15){ --a:315deg } .rosette i:nth-child(16){ --a:337.5deg }
.rosette b{
  position:absolute; left:50%; top:50%;
  width:max(2px, calc(var(--u) * 2)); height:max(2px, calc(var(--u) * 2));
  margin-left:calc(max(2px, calc(var(--u) * 2)) / -2);
  margin-top:calc(max(2px, calc(var(--u) * 2)) / -2);
  background:currentColor; border-radius:50%;
}
.rosette.sm{ --rs:20px; }
.rosette.md{ --rs:clamp(52px,9vw,96px); }
.rosette.huge{ --rs:clamp(200px,46vw,440px); }

/* ---- grid backdrop ---- */
#grid{ position:fixed; inset:0; z-index:0; pointer-events:none; max-width:var(--maxw); margin:0 auto; padding:0 var(--pad); }
#grid div{ height:100%; background-image:repeating-linear-gradient(to right, rgba(15,20,18,.055) 0 1px, transparent 1px calc(100%/6)); }
@media (max-width:860px){ #grid{ display:none; } }
.layer{ position:relative; z-index:1; }

/* ---- nav ---- */
.nav{
  position:fixed; top:0; left:0; right:0; z-index:8;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:1.1rem var(--pad); font-size:.8125rem; transition:background-color .3s;
}
.nav.solid{ background:color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter:blur(10px); }
.nav .mark{ display:flex; align-items:center; gap:.65rem; font-weight:600; letter-spacing:-.03em; font-size:1rem; text-decoration:none; color:var(--text); transition:color .3s; }
.nav ul{ display:flex; gap:clamp(1rem,2.5vw,2.25rem); list-style:none; margin:0; padding:0; }
.nav ul a{ text-decoration:none; color:var(--soft); transition:color .25s; }
.nav ul a:hover, .nav ul a.on{ color:var(--text); }
.nav ul a.on{ font-weight:400; }
.nav.over-dark{ background:color-mix(in srgb, var(--ink) 80%, transparent); }
.nav.over-dark .mark{ color:#EFF1ED; }
.nav.over-dark ul a{ color:#8E9A94; }
.nav.over-dark ul a:hover, .nav.over-dark ul a.on{ color:#EFF1ED; }

/* ---- string divider ---- */
.string{ display:block; width:100%; height:46px; touch-action:pan-y; cursor:crosshair; }
.rule{ transform:scaleX(0); transform-origin:left; transition:transform 1.1s cubic-bezier(.22,.7,.2,1); }
.in .rule{ transform:scaleX(1); }

/* ---- header ---- */
.head{ padding:clamp(7rem,16vh,10rem) 0 clamp(2rem,6vh,3.5rem); }
.head .lockup{ display:flex; align-items:center; gap:clamp(1rem,3vw,2.2rem); }
.head h1{ margin:0; font-weight:600; letter-spacing:-.05em; line-height:.9; font-size:clamp(2.6rem,9vw,6.5rem); }
.head h1 .sub{ display:block; font-family:var(--mono); font-weight:400; font-size:clamp(.625rem,1.1vw,.75rem); letter-spacing:.4em; color:var(--soft); margin-top:1.1rem; }
.head p{ margin:clamp(1.8rem,5vh,2.8rem) 0 0; font-size:clamp(1.05rem,2.2vw,1.55rem); font-weight:200; line-height:1.5; letter-spacing:-.03em; max-width:34ch; }

/* ---- pieces ---- */
section{ padding:0 0 clamp(3rem,9vh,6rem); }
.label{ font-family:var(--mono); font-size:.6875rem; color:var(--soft); margin:.5rem 0 clamp(1.8rem,5vh,3rem); display:flex; gap:1.2rem; align-items:baseline; }
.label b{ font-weight:400; color:var(--text); }

.pieces{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 21rem), 1fr)); gap:0 clamp(2rem,5vw,4.5rem); }
.piece{
  display:block; text-decoration:none; color:inherit;
  border-top:1px solid var(--line);
  padding:clamp(1.4rem,3vw,2rem) 0 clamp(1.8rem,4vw,2.6rem);
  opacity:0; transform:translateY(8px);
  transition:opacity .7s ease, transform .7s cubic-bezier(.22,.7,.2,1);
}
.in .piece{ opacity:1; transform:none; }
.piece .card{ width:100%; height:clamp(110px,15vh,140px); display:block; margin-bottom:1.3rem; }
.piece h2{
  margin:0 0 .5rem; font-weight:400; letter-spacing:-.035em; line-height:1.3;
  font-size:clamp(1.2rem,2.6vw,1.6rem);
  display:inline-block; position:relative;
}
.piece h2::after{
  content:""; position:absolute; left:0; right:0; bottom:-.12em; height:1px;
  background:var(--accent); transform:scaleX(0); transform-origin:left;
  transition:transform .45s cubic-bezier(.2,.7,.2,1);
}
.piece:hover h2::after, .piece:focus-visible h2::after{ transform:scaleX(1); }
.piece p{ margin:0 0 1.1rem; font-size:.9375rem; color:color-mix(in srgb, var(--text) 82%, transparent); max-width:38ch; }
.meta{ display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1rem; font-family:var(--mono); font-size:.625rem; color:var(--soft); letter-spacing:.02em; }
.meta .how{ color:var(--accent); }
.meta .url{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }

/* ---- footer ---- */
.foot{ background:var(--ink); color:#EFF1ED; padding:clamp(4rem,12vh,7rem) 0 0; }
.foot .label{ color:#7D8A84; }
.foot .label b{ color:#EFF1ED; }
.foot h2{ margin:0 0 clamp(1.6rem,5vh,2.4rem); font-weight:200; font-size:clamp(1.5rem,4.5vw,2.8rem); line-height:1.3; letter-spacing:-.04em; max-width:20ch; }
.backrow{ display:flex; flex-wrap:wrap; gap:1rem 1.5rem; align-items:center; }
.back{
  font-weight:300; font-size:clamp(1.1rem,3vw,1.7rem); letter-spacing:-.035em; text-decoration:none;
  border-bottom:1px solid rgba(239,241,237,.3); padding-bottom:.08em; transition:.3s;
}
.back:hover{ color:#5FB894; border-color:#5FB894; }
.fnote{ margin:clamp(3rem,9vh,5rem) 0 0; padding-top:2rem; border-top:1px solid rgba(239,241,237,.16); font-family:var(--mono); font-size:.625rem; color:#5E6A64; }
.bigrose{
  --big:clamp(200px,46vw,440px);
  display:flex; justify-content:center; align-items:flex-start;
  margin:clamp(2rem,7vh,4rem) 0 0; height:calc(var(--big) / 2); overflow:hidden;
  color:rgba(239,241,237,.09); pointer-events:none;
}
.bigrose .rosette.huge{ --rs:var(--big); }

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ transition-duration:.001ms !important; }
  .piece{ opacity:1; transform:none; } .rule{ transform:scaleX(1); }
}
</style>
</head>
<body>

    <div class="lockup">

      <h1>딴짓<span class="sub">SIDE TRACKS</span></h1>

    </div>

</div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var coarse = window.matchMedia("(pointer: coarse)").matches;
  var INK = "15,20,18", ACC = "15,107,79";

  /* ================= the pieces ================= */
  var ITEMS = [
    { repo:"gravity_post", title:"중력 우편함", sketch:"orbit", how:"클릭",
      desc:"오늘의 뉴스가 행성이 됩니다. 기사 속 키워드가 편지처럼 날아가 저마다의 행성에 도착하고, 행성을 누르면 그 기사의 요약이 열립니다." },
    { repo:"mood_garden", title:"감정 정원", sketch:"bloom", how:"드래그",
      desc:"지금의 마음 크기를 슬라이더로 맞추면 거기 어울리는 꽃이 피어납니다. 꽃말과 개화 시기가 적힌 표본 라벨이 함께 붙습니다." },
    { repo:"letter_drop", title:"글자낙하", sketch:"stack", how:"키보드 · 마우스",
      desc:"입력한 글자가 무게를 갖습니다. 집어서 던지고, 중력을 끄고, 화면을 흔들어 쏟아 버릴 수 있습니다." },
    { repo:"sky_window", title:"하늘창", sketch:"clouds", how:"클릭 · 드래그",
      desc:"시간에 따라 색이 바뀌는 창 하나. 구름을 끌어 흩고, 누르면 별똥별이 지나가고, 가끔 동물이 찾아옵니다." },
    { repo:"sound_sketch", title:"소리그림", sketch:"wave", how:"드래그 · 스페이스",
      desc:"선을 그으면 그대로 음악이 됩니다. 선의 높이가 음높이가 되어 왼쪽부터 재생되고, 음계와 음색을 골라 둘 수 있습니다." },
    { repo:"letter_rain", title:"Letter Rain", sketch:"rain", how:"키보드 · 클릭",
      desc:"글자가 비처럼 내려 바닥에 쌓입니다. 누른 키가 떨어지고, 클릭하면 터지고, 스페이스로 한 번에 쓸어냅니다." }
  ];

  var host = document.querySelector(".pieces");
  ITEMS.forEach(function(it){
    var a = document.createElement("a");
    a.className = "piece";
    a.href = "https://tajogood.github.io/" + it.repo + "/";
    a.target = "_blank"; a.rel = "noopener";
    a.innerHTML =
      '<canvas class="card" data-sketch="' + it.sketch + '" aria-hidden="true"></canvas>' +
      '<h2>' + it.title + '</h2>' +
      '<p>' + it.desc + '</p>' +
      '<div class="meta"><span class="how">' + it.how + '</span>' +
      '<span class="url">tajogood.github.io/' + it.repo + '</span></div>';
    host.appendChild(a);

    var cv = a.querySelector(".card");
    var live = false;
    function start(){ if(reduce || live) return; live = true; animate(cv, it.sketch, function(){ return live; }); }
    function stop(){ live = false; draw(cv, it.sketch, 1); }
    a.addEventListener("pointerenter", start);
    a.addEventListener("pointerleave", stop);
    a.addEventListener("focus", start);
    a.addEventListener("blur", stop);
  });

  /* ================= sketches ================= */
  function fit(cv){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth || 300, h = cv.clientHeight || 120;
    cv.width = Math.floor(w*dpr); cv.height = Math.floor(h*dpr);
    var c = cv.getContext("2d");
    c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,w,h);
    c.lineCap = "round"; c.lineJoin = "round";
    return { c:c, w:w, h:h };
  }
  function ink(a){ return "rgba(" + INK + "," + a + ")"; }
  function acc(a){ return "rgba(" + ACC + "," + a + ")"; }

  // t: 0..1 progress for the resting frame, or a running clock when animating
  function draw(cv, mode, t){
    var g = fit(cv), c = g.c, w = g.w, h = g.h, i;

    if(mode === "orbit"){
      var cx = w*0.5, cy = h*0.58;
      for(i=0;i<4;i++){
        var rx = w*0.1 + i*(w*0.105), ry = rx*0.42;
        c.beginPath(); c.ellipse(cx, cy, rx, ry, -0.22, 0, Math.PI*2);
        c.strokeStyle = ink(0.07 + (3-i)*0.02); c.lineWidth = 0.8; c.stroke();
        var ang = t*1.1 + i*1.9;
        var px = cx + Math.cos(ang)*rx*Math.cos(-0.22) - Math.sin(ang)*ry*Math.sin(-0.22);
        var py = cy + Math.cos(ang)*rx*Math.sin(-0.22) + Math.sin(ang)*ry*Math.cos(-0.22);
        c.beginPath(); c.arc(px, py, i===1 ? 3.4 : 2.1, 0, Math.PI*2);
        c.fillStyle = i===1 ? acc(0.9) : ink(0.4); c.fill();
      }
      c.beginPath(); c.arc(cx, cy, 2.6, 0, Math.PI*2); c.fillStyle = ink(0.55); c.fill();
    }

    if(mode === "bloom"){
      var open = 0.72 + 0.28*Math.sin(t*0.8);              // petals breathe open and shut
      var bx = w*0.5, groundY = h*0.94, headY = h*0.30;
      c.beginPath(); c.moveTo(bx, groundY);
      c.bezierCurveTo(bx - w*0.035, h*0.74, bx + w*0.03, h*0.5, bx, headY + h*0.08);
      c.strokeStyle = ink(0.32); c.lineWidth = 1.2; c.stroke();

      for(i=0;i<2;i++){                                     // leaves
        var ly = h*(0.62 + i*0.15), dir = i%2 ? 1 : -1, lw = w*0.085;
        c.beginPath(); c.moveTo(bx, ly);
        c.quadraticCurveTo(bx + dir*lw*0.7, ly - h*0.11, bx + dir*lw, ly - h*0.01);
        c.quadraticCurveTo(bx + dir*lw*0.55, ly + h*0.05, bx, ly);
        c.strokeStyle = ink(0.22); c.lineWidth = 0.9; c.stroke();
      }

      var petals = 8, pr = h*0.085*open, ring = h*0.105*open;
      for(i=0;i<petals;i++){
        var pa = (i/petals)*Math.PI*2 - Math.PI/2 + t*0.08;
        c.save();
        c.translate(bx + Math.cos(pa)*ring, headY + Math.sin(pa)*ring);
        c.rotate(pa);
        c.beginPath(); c.ellipse(0, 0, pr, pr*0.55, 0, 0, Math.PI*2);
        c.strokeStyle = i===0 ? acc(0.8) : ink(0.26); c.lineWidth = i===0 ? 1.2 : 0.9;
        c.stroke(); c.restore();
      }
      c.beginPath(); c.arc(bx, headY, h*0.045, 0, Math.PI*2);
      c.fillStyle = acc(0.85); c.fill();
    }

    if(mode === "stack"){
      var base = h*0.94, bw = w*0.062, bh = h*0.13;
      var piles = [3,2,4,1,3];
      for(i=0;i<piles.length;i++){
        for(var k=0;k<piles[i];k++){
          var x = w*0.16 + i*(bw*1.55), y = base - (k+1)*bh*1.12;
          var tilt = Math.sin(i*2.1 + k) * 0.08;
          c.save(); c.translate(x, y); c.rotate(tilt);
          c.beginPath(); c.rect(-bw/2, -bh/2, bw, bh);
          c.strokeStyle = (i===2 && k===3) ? acc(0.85) : ink(0.26); c.lineWidth = 1; c.stroke();
          c.restore();
        }
      }
      var fall = ((t*0.32) % 1);
      var fy = bh*0.8 + (base - h*0.42 - bh*0.8) * fall;   // stays clear of the top edge
      c.save(); c.translate(w*0.68, fy); c.rotate(fall*2.6);
      c.beginPath(); c.rect(-bw/2, -bh/2, bw, bh);
      c.strokeStyle = acc(0.8); c.lineWidth = 1.1; c.stroke();
      c.restore();
      c.beginPath(); c.moveTo(w*0.06, base + 2); c.lineTo(w*0.94, base + 2);
      c.strokeStyle = ink(0.16); c.lineWidth = 1; c.stroke();
    }

    if(mode === "clouds"){
      var horizon = h*0.82;
      c.beginPath(); c.arc(w*0.2, h*0.3, h*0.11, 0, Math.PI*2);   // the sun in the window
      c.strokeStyle = acc(0.7); c.lineWidth = 1.2; c.stroke();

      // each cloud is a run of overlapping humps on its own baseline
      var clouds = [
        { y:h*0.34, s:1.00, sp:11, hot:false },
        { y:h*0.53, s:0.74, sp:17, hot:true  },
        { y:h*0.70, s:1.18, sp:7,  hot:false }
      ];
      for(i=0;i<clouds.length;i++){
        var cl = clouds[i];
        var span = w*0.34*cl.s, hump = h*0.17*cl.s;
        var x0 = ((t*cl.sp + i*260) % (w + span*2)) - span;
        var y0 = cl.y;
        // one continuous silhouette — overlapping arcs would show their inner edges
        c.beginPath();
        c.moveTo(x0, y0);
        c.quadraticCurveTo(x0 + span*0.06, y0 - hump*0.80, x0 + span*0.26, y0 - hump*0.66);
        c.quadraticCurveTo(x0 + span*0.36, y0 - hump*1.30, x0 + span*0.57, y0 - hump*1.08);
        c.quadraticCurveTo(x0 + span*0.75, y0 - hump*1.18, x0 + span*0.86, y0 - hump*0.52);
        c.quadraticCurveTo(x0 + span*0.96, y0 - hump*0.26, x0 + span*1.00, y0);
        c.closePath();
        c.strokeStyle = cl.hot ? acc(0.6) : ink(0.2);
        c.lineWidth = cl.hot ? 1.2 : 0.9;
        c.stroke();
      }
      c.beginPath(); c.moveTo(w*0.04, horizon); c.lineTo(w*0.96, horizon);
      c.strokeStyle = ink(0.16); c.lineWidth = 1; c.stroke();
    }

    if(mode === "wave"){
      var pts = [];
      for(i=0;i<=60;i++){
        var u = i/60;
        var y = h*0.5 + Math.sin(u*6.1 + 0.4)*h*0.2 + Math.sin(u*13.3)*h*0.07;
        pts.push([w*0.06 + u*w*0.88, y]);
      }
      c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
      for(i=1;i<pts.length;i++) c.lineTo(pts[i][0], pts[i][1]);
      c.strokeStyle = ink(0.28); c.lineWidth = 1.2; c.stroke();
      for(i=0;i<pts.length;i+=10){
        c.beginPath(); c.arc(pts[i][0], pts[i][1], 1.8, 0, Math.PI*2);
        c.fillStyle = ink(0.3); c.fill();
      }
      var ph = (t*0.26) % 1;
      var px2 = w*0.06 + ph*w*0.88;
      c.beginPath(); c.moveTo(px2, h*0.1); c.lineTo(px2, h*0.9);
      c.strokeStyle = acc(0.7); c.lineWidth = 1.1; c.stroke();
      var idx = Math.min(pts.length-1, Math.round(ph*60));
      c.beginPath(); c.arc(pts[idx][0], pts[idx][1], 3.2, 0, Math.PI*2);
      c.fillStyle = acc(0.95); c.fill();
    }

    if(mode === "rain"){
      var floor = h*0.9, cols = 13;
      for(i=0;i<cols;i++){
        var cxp = w*0.08 + i*(w*0.84/(cols-1));
        var seed = i*1.7;
        var p = ((t*0.36) + Math.sin(seed)*0.5 + i*0.11) % 1;
        var dy = -h*0.1 + p*(floor + h*0.1);
        var len = h*0.1 + (i%3)*h*0.03;
        c.beginPath(); c.moveTo(cxp, dy); c.lineTo(cxp, dy + len);
        c.strokeStyle = i===6 ? acc(0.8) : ink(0.2 + (i%4)*0.03); c.lineWidth = i===6 ? 1.3 : 0.9; c.stroke();
        var pileH = (2 + (i % 5)) * 2.6;
        c.beginPath(); c.moveTo(cxp, floor); c.lineTo(cxp, floor - pileH);
        c.strokeStyle = ink(0.17); c.lineWidth = 2.4; c.stroke();
      }
      c.beginPath(); c.moveTo(w*0.05, floor + 2); c.lineTo(w*0.95, floor + 2);
      c.strokeStyle = ink(0.16); c.lineWidth = 1; c.stroke();
    }
  }

  function animate(cv, mode, alive){
    var t0 = performance.now();
    (function step(now){
      if(!alive()) return;
      draw(cv, mode, (now - t0)/1000 + 1);
      requestAnimationFrame(step);
    })(t0);
  }

  function paintAll(){
    document.querySelectorAll(".card").forEach(function(cv){
      draw(cv, cv.getAttribute("data-sketch"), 1);
    });
  }

  /* ================= string divider ================= */
  var strings = [];
  function Str(el){
    this.el = el; this.ctx = el.getContext("2d");
    this.y = []; this.v = []; this.seed = Math.random()*Math.PI*2; this.energy = 0;
    this.size();
  }
  Str.prototype.size = function(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = this.el.clientWidth || 1; this.h = this.el.clientHeight || 40;
    this.el.width = Math.floor(this.w*dpr); this.el.height = Math.floor(this.h*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.n = Math.max(12, Math.round(this.w/7) + 1);
    this.gap = this.w/(this.n-1);
    var y=[], v=[];
    for(var i=0;i<this.n;i++){ y.push(0); v.push(0); }
    this.y=y; this.v=v; this.energy=0;
    this.render();
  };
  Str.prototype.pull = function(px, py, vy){
    var idx = Math.round(px/this.gap);
    if(idx < 1 || idx > this.n-2) return;
    var target = Math.max(-this.h*0.42, Math.min(this.h*0.42, py - this.h/2));
    var reach = Math.round(this.n*0.16);
    for(var d=-reach; d<=reach; d++){
      var i = idx+d;
      if(i<1 || i>this.n-2) continue;
      var f = Math.cos((d/reach)*Math.PI*0.5); f = f*f;
      this.y[i] += (target - this.y[i]) * f * 0.36;
      this.v[i] += vy * f * 0.11;
    }
    this.energy = 1; wake();
  };
  Str.prototype.impulse = function(force){
    if(Math.abs(force) < 0.05) return;
    for(var i=1;i<this.n-1;i++){
      var u = i/(this.n-1);
      this.v[i] += force * Math.sin(Math.PI*u) * (0.72 + 0.28*Math.sin(u*Math.PI*2 + this.seed));
    }
    this.energy = 1; wake();
  };
  Str.prototype.step = function(){
    if(this.energy <= 0) return false;
    var y=this.y, v=this.v, n=this.n, e=0, i;
    for(i=1;i<n-1;i++){
      var a = (y[i-1] + y[i+1] - 2*y[i]) * 0.42;
      a -= y[i] * 0.011;
      v[i] = (v[i] + a) * 0.982;
    }
    var lim = this.h*0.45;
    for(i=1;i<n-1;i++){
      y[i] += v[i];
      if(y[i] > lim){ y[i] = lim; v[i] *= -0.4; }
      else if(y[i] < -lim){ y[i] = -lim; v[i] *= -0.4; }
      e += Math.abs(v[i]) + Math.abs(y[i])*0.05;
    }
    y[0]=0; y[n-1]=0; v[0]=0; v[n-1]=0;
    this.energy = e < this.n * 0.035 ? 0 : 1;
    if(this.energy === 0){ for(i=0;i<n;i++){ y[i]=0; v[i]=0; } }
    this.render();
    return this.energy > 0;
  };
  Str.prototype.render = function(){
    var c = this.ctx, cy = this.h/2, peak = 0, i;
    c.clearRect(0,0,this.w,this.h);
    for(i=0;i<this.n;i++){ var m = Math.abs(this.y[i]); if(m>peak) peak = m; }
    var t = Math.min(1, peak/(this.h*0.3));
    c.beginPath(); c.moveTo(0, cy + this.y[0]);
    for(i=1;i<this.n;i++){ c.lineTo(i*this.gap, cy + this.y[i]); }
    c.lineCap = "round";
    c.lineWidth = 1 + t*0.6;
    c.strokeStyle = t > 0.02 ? acc(0.24 + t*0.7) : ink(0.2);
    c.stroke();
  };
  var running = false;
  function wake(){ if(running || reduce) return; running = true; requestAnimationFrame(tick); }
  function tick(){
    var any = false;
    for(var i=0;i<strings.length;i++){ if(strings[i].step()) any = true; }
    if(any) requestAnimationFrame(tick); else running = false;
  }
  document.querySelectorAll(".string").forEach(function(el){ strings.push(new Str(el)); });

  var last = { y:0 };
  window.addEventListener("pointermove", function(e){
    if(reduce) return;
    for(var i=0;i<strings.length;i++){
      var s = strings[i], r = s.el.getBoundingClientRect();
      if(r.width < 2) continue;
      var band = coarse ? 26 : 8;
      if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top - band && e.clientY <= r.bottom + band){
        s.pull(e.clientX - r.left, e.clientY - r.top, (e.clientY - last.y) * 0.5);
      }
    }
    last.y = e.clientY;
  }, {passive:true});

  /* ================= reveal, nav ================= */
  var io = new IntersectionObserver(function(en){
    en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } });
  }, { threshold:.05, rootMargin:"0px 0px -4% 0px" });
  document.querySelectorAll("section").forEach(function(s){ io.observe(s); });

  var nav = document.querySelector(".nav");
  var darkPanels = Array.prototype.slice.call(document.querySelectorAll(".foot"));
  var ticking = false, prevY = window.scrollY;
  window.addEventListener("scroll", function(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var y = window.scrollY, dv = y - prevY; prevY = y;
      nav.classList.toggle("solid", y > 40);
      var edge = nav.offsetHeight * 0.6, dark = false;
      for(var i=0;i<darkPanels.length;i++){
        var r = darkPanels[i].getBoundingClientRect();
        if(r.top <= edge && r.bottom >= edge){ dark = true; break; }
      }
      nav.classList.toggle("over-dark", dark);
      if(!reduce && coarse && Math.abs(dv) > 2){
        var f = Math.max(-52, Math.min(52, dv)) * 0.052, vh = window.innerHeight;
        for(var j=0;j<strings.length;j++){
          var s = strings[j], rr = s.el.getBoundingClientRect();
          if(rr.width < 2 || rr.bottom < 0 || rr.top > vh) continue;
          s.impulse(-f);
        }
      }
      ticking = false;
    });
  }, {passive:true});

  var rt;
  window.addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      strings.forEach(function(s){ s.size(); });
      paintAll();
    }, 160);
  });

  paintAll();
  setTimeout(paintAll, 400);   // after webfonts settle the layout
})();
</script>
</body>
</html>
